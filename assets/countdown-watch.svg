    <path d="m119 73 6 11M241 276l6 11M73 241l11-6M276 119l11-6" stroke-width="3"/>
    <path d="m73 119 11 6M276 241l11 6M119 287l6-11M241 84l6-11" stroke-width="3"/>
  </g>
  <path d="M180 180 137 151" stroke="#f5d36b" stroke-width="5" stroke-linecap="round"/>
  <path d="M180 180 180 103" stroke="#f5d36b" stroke-width="3" stroke-linecap="round"/>
  <path d="M180 180 221 127" stroke="#f0a63a" stroke-width="2" stroke-linecap="round"/>
