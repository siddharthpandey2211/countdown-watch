<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Countdown Watch</title>
  <desc id="desc">A black circular watch with a golden rim and a countdown display.</desc>
