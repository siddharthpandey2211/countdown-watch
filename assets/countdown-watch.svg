  <circle cx="180" cy="180" r="133" fill="#000" stroke="#f6c94a" stroke-width="6"/>
  <circle cx="180" cy="180" r="122" fill="none" stroke="#806c2d" stroke-width="2"/>
  <g stroke="#d6b84f" stroke-linecap="round">
